function render(list) {
  const grid = document.getElementById('projects-grid');
  grid.innerHTML = list.map(p => `
    <div class="glass rounded-xl p-5 card-hover border border-gray-800/50" data-category="${p.category}">
      <div class="flex items-start justify-between mb-3">
        <div>
          <span class="text-xs font-mono text-gray-500">${p.id}</span>
          <h3 class="font-semibold text-gray-100 leading-tight mt-0.5">${p.name}</h3>
        </div>
        <span class="px-2 py-0.5 rounded-full text-[10px] font-medium border ${statusStyles[p.statusColor]}">${p.statusLabel}</span>
      </div>
      <div class="text-sm text-gray-400 mb-3 space-y-1">
        <p><span class="text-gray-500">Directorio:</span> <code class="text-xs bg-gray-800 px-1 py-0.5 rounded text-gray-300">${p.dir}</code></p>
        <p><span class="text-gray-500">Actualizado:</span> ${p.updated}</p>
      </div>
      <div class="text-xs text-gray-500 leading-relaxed mb-3">
        <span class="text-indigo-400 font-medium">Metodología:</span> ${p.method}
      </div>
      <div class="flex gap-2 mt-auto">
        ${p.repo ? `<a href="${p.repo}" target="_blank" class="flex-1 text-center py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs font-medium text-gray-300 transition">GitHub ↗</a>` : '<span class="flex-1 text-center py-1.5 rounded-lg bg-gray-900 text-xs text-gray-600 cursor-not-allowed">Sin repo</span>'}
      </div>
    </div>
  `).join('');
  document.getElementById('total-count').textContent = list.length;
}

function filter(cat) {
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('bg-indigo-600', 'text-white');
    b.classList.add('bg-gray-800', 'text-gray-400');
  });
  document.querySelector(`[data-filter="${cat}"]`).classList.remove('bg-gray-800', 'text-gray-400');
  document.querySelector(`[data-filter="${cat}"]`).classList.add('bg-indigo-600', 'text-white');

  if (cat === 'all') render(projects);
  else render(projects.filter(p => p.category === cat));
}
